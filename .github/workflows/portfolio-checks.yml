name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Install dependencies and validate available scripts
        run: |
          find . -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' -print
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
          npm test --if-present
          npm run build --if-present
