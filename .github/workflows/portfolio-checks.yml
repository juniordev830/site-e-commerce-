name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Install and validate each Node project
        shell: bash
        run: |
          found=0
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            found=1
            dir="$(dirname "$manifest")"
            echo "Validando projeto em $dir"
            pushd "$dir" >/dev/null
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm test --if-present
            npm run build --if-present
            popd >/dev/null
          done < <(find . -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.github/*' -print)
          if [ "$found" -eq 0 ]; then
            echo "::error::Nenhum package.json encontrado."
            exit 1
          fi
