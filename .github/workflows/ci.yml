name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without automatic lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build the pinned SQLite native dependency
        run: npm rebuild better-sqlite3
      - name: Generate the Prisma client using the repository script
        run: npm run postinstall -w backend
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Unit tests for browser cart persistence
        run: node --experimental-strip-types --test frontend/tests/cart.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Integration tests for checkout and authorization
        run: npm run test -w backend
