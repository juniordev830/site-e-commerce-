name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: Integration tests for checkout and authorization
        run: npm run test -w backend
      - name: Diagnose external quality findings on base commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_HEAD: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = "https://api.github.com/repos/" + os.environ["GH_REPO"]
          def read(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(req))
          for check in read(base + "/commits/" + os.environ["GH_HEAD"] + "/check-runs")["check_runs"]:
              if check["name"] == "SonarCloud Code Analysis":
                  for note in read(check["output"]["annotations_url"]):
                      print(json.dumps({key: note.get(key) for key in ("path", "start_line", "message", "title")}))
          PY
